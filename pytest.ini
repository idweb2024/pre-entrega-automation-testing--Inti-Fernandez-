[pytest]
pythonpath = .
addopts = -v --html=reports/report.html --self-contained-html --metadata Autor "Inti Fernandez" --metadata Proyecto "Pre-Entrega Automation Testing"
markers =
    smoke: tests de humo del flujo principal
    api: tests de API con requests
    e2e: tests de flujo completo (ciclo de vida de un recurso)
    bdd: suite BDD de Behave ejecutada desde pytest
    regression: pruebas de regresión