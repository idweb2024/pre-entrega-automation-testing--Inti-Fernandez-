name: CI TalentoLab

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHON_VERSION: '3.14'
      REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar tests (UI + API + BDD)
        run: pytest

      - name: Subir reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: reports/
          retention-days: 90

      - name: Subir logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-log
          path: logs/
          retention-days: 90