[behave]
# Palabras clave de Gherkin en inglés (Feature, Scenario, Given, When, Then...)
lang = en
# Por defecto, excluir los escenarios en progreso
default_tags = not @wip
# Carpeta donde están los .feature
paths = features

[behave.formatters]
# Registra el formato "html" para poder usar: behave -f html -o reports/behave.html
html = behave_html_formatter:HTMLFormatter